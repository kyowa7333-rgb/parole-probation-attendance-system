name: last
description: Parole and Probation Attendance Monitoring System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.2
  responsive_framework: ^1.5.1
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: assets/branding/app_icon.png

flutter:
  uses-material-design: true
